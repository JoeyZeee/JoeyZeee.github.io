
name: Scheduled Quarto Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 27 11 *"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check publication date
        id: datecheck
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || \
             [[ "$(TZ=America/Chicago date +%F)" == "2026-11-27" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove draft status from PCA article
        if: steps.datecheck.outputs.run == 'true'
        run: |
          sed -i '/^draft: true$/d' posts/Inside-Pete-Crow-Armstrongs-MVP-Transformation/index.qmd

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add posts/Inside-Pete-Crow-Armstrongs-MVP-Transformation/index.qmd

          if ! git diff --cached --quiet; then
            git commit -m "Publish PCA MVP article"
            git push
          fi

      - name: Set up Quarto
        if: steps.datecheck.outputs.run == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish website
        if: steps.datecheck.outputs.run == 'true'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
