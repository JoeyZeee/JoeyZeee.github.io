
name: Scheduled Quarto Publish

on:
  schedule:
    - cron: "0 19 20 11 *"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove draft status from scheduled article
        run: |
          sed -i '/^draft: true$/d' posts/scheduled-test/index.qmd

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add posts/scheduled-test/index.qmd

          if ! git diff --cached --quiet; then
            git commit -m "Publish scheduled test article"
            git push
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish website
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
